# Shared-folder storage: edit BOTH source paths to match your own Docker host.
# Example folder: /media/nemo (or any folder on your own mounted share).
name: nemos-reef

services:
  nemo:
    image: ghcr.io/lozza/nemos-reef-re:latest
    pull_policy: always
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        # EDIT: the original APK file on your server/share.
        source: /path/to/your-share/nemo/nemo.apk
        target: /game/nemo.apk
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        # EDIT: the folder for saved reefs, accounts and logs.
        source: /path/to/your-share/nemo/data
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
