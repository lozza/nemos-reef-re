name: Docker build and smoke test
on:
  pull_request:
  push:
    paths:
      - 'server/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose*.yaml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Prepare synthetic assets and build overrides
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tests')
          from test_server_runtime import make_apk
          make_apk(Path('nemo.apk'))
          for name, context in (
              ('ci-local.yaml', '.'),
              ('ci-github.yaml', 'https://github.com/lozza/nemos-reef-re.git#' + os.environ['GITHUB_SHA']),
          ):
              Path(name).write_text(json.dumps({'services': {'nemo': {'build': {'context': context}}}}))
          PY
      - name: Validate the shared configuration and compatibility copies
        run: |
          for file in compose.yaml compose.github.yaml compose.omv.yaml; do
            docker compose -f "$file" config --quiet
          done
          cmp compose.yaml compose.github.yaml
          cmp compose.yaml compose.omv.yaml
      - name: Build and start from local source
        run: docker compose -f compose.yaml -f ci-local.yaml up -d --build --wait --wait-timeout 120
      - name: Check health and save persistence
        run: |
          curl --fail http://127.0.0.1:8080/healthz
          docker compose exec -T nemo python -c "from pathlib import Path; assert Path('/data/nemo.db').is_file(); Path('/data/probe').write_text('persisted')"
          docker compose -f compose.yaml -f ci-local.yaml up -d --force-recreate --wait --wait-timeout 120
          docker compose exec -T nemo python -c "from pathlib import Path; assert Path('/data/probe').read_text() == 'persisted'"
      - name: Build from GitHub and keep existing saves
        run: |
          docker compose -f compose.yaml -f ci-github.yaml up -d --build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8080/healthz
          docker compose exec -T nemo python -c "from pathlib import Path; assert Path('/data/probe').read_text() == 'persisted'"
      - name: Reject a missing APK without creating a directory
        run: |
          docker compose down
          mv nemo.apk fixture.apk
          if docker compose up -d --no-build; then
            echo "Expected startup to fail without nemo.apk"
            exit 1
          fi
          test ! -e nemo.apk
          mv fixture.apk nemo.apk
      - name: Show logs and clean up
        if: always()
        run: |
          docker compose logs --tail=100
          docker compose down -v
